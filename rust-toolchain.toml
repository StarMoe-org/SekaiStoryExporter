# 长期项目：工具链必须钉死版本。
# 升级工具链 = 一次可能改变浮点/优化行为的变更，须走 ADR 并重跑 fidelity 全量回归。
# Long-term project: the toolchain must be pinned. Upgrading it may alter floating-point
# or optimisation behaviour, so it requires an ADR and a full fidelity regression run.
[toolchain]
channel    = "1.98.1"
components = ["rustfmt", "clippy"]
targets    = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
