[package]
name = "sse-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sse-core = { path = "../sse-core" }
ripper-format.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
hound = "3.5"
thiserror = "2"
# Remote libraries (ADR-0015): SigV4 signing only, HTTP over rustls with the ring provider.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "http2", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto"] }
url = "2"
webpki-roots = "1"

[lints]
workspace = true
