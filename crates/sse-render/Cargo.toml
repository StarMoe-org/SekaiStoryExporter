[package]
name = "sse-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sse-core = { path = "../sse-core" }
sse-assets = { path = "../sse-assets" }
sse-live2d = { path = "../sse-live2d" }
sse-text = { path = "../sse-text" }
sse-params = { path = "../sse-params" }
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"

[lints]
workspace = true
