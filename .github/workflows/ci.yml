# Build, lint and test on every supported platform (ADR-0014). No game assets and no Cubism
# SDK are needed: Cubism Core is loaded at run time (ADR-0003). The same jobs run on Gitea
# Actions from .gitea/workflows/ci.yml with self-hosted runner labels.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p sse-cli

  docs-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links between docs
        run: |
          fail=0
          while IFS= read -r line; do
            f="${line%%:*}"; rest="${line#*:}"
            for ref in $(printf '%s' "$rest" | grep -oE '\(([A-Za-z0-9_./-]+\.md)\)' | tr -d '()'); do
              base="$(dirname "$f")"
              [ -f "$base/$ref" ] || [ -f "$ref" ] || { echo "broken link: $f -> $ref"; fail=1; }
            done
          done < <(grep -rn '](.*\.md)' --include='*.md' . || true)
          exit $fail
