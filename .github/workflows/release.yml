# Builds `sse` for every supported platform when a `v*` tag is pushed and attaches the
# archives to a GitHub release. Cubism Core is not included (ADR-0002, ADR-0003).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p sse-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=sse-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$name/tools"
          cp README.md CHANGELOG.md LICENSE LICENSE-EXCEPTION "$name/"
          cp -r tools/ui-kit "$name/tools/"
          if [ -f target/${{ matrix.target }}/release/sse.exe ]; then
            cp target/${{ matrix.target }}/release/sse.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp target/${{ matrix.target }}/release/sse "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sse-${{ matrix.target }}
          path: sse-*.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## "v"( |（|$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
